social_links:
  - id: instagram
    label: Instagram
    url: https://www.instagram.com/ogblacman/
    title: Follow OG Blacman on Instagram
    target: _blank
    icon:
      src: /assets/reference/social-instagram-icon.svg
      alt: Instagram
  - id: tiktok
    label: TikTok
    url: http://tiktok.com/@ogblacman
    title: Follow OG Blacman on TikTok
    target: _blank
    icon:
      src: /assets/reference/social-tiktok-icon.png
      alt: TikTok
      sizes: "(max-width: 1168px) 100vw, 1168px"
      sources:
        - { src: /assets/reference/social-tiktok-icon-500w.png, width: 500 }
        - { src: /assets/reference/social-tiktok-icon-800w.png, width: 800 }
        - { src: /assets/reference/social-tiktok-icon-1080w.png, width: 1080 }
        - { src: /assets/reference/social-tiktok-icon.png, width: 1168 }
  - id: youtube
    label: YouTube
    url: http://tiktok.com/@ogblacman
    title: Watch OG Blacman
    target: _blank
    icon:
      src: /assets/reference/social-youtube-icon.png
      alt: YouTube
      sizes: "(max-width: 512px) 100vw, 512px"
      sources:
        - { src: /assets/reference/social-youtube-icon-500w.png, width: 500 }
        - { src: /assets/reference/social-youtube-icon.png, width: 512 }
sections:
  hero:
    heading: { title: OG BLACMAN }
    cta: { label: CLIMB DOWN, url: null, title: null }
    media:
      desktop:
        poster: /assets/hero/hero-montage-desktop-poster.jpg
        sources:
          - { src: /assets/hero/hero-montage-desktop.mp4, type: video/mp4 }
          - { src: /assets/hero/hero-montage-desktop.webm, type: video/webm }
      mobile:
        poster: /assets/hero/hero-montage-mobile-poster.jpg
        sources:
          - { src: /assets/hero/hero-montage-mobile.mp4, type: video/mp4 }
          - { src: /assets/hero/hero-montage-mobile.webm, type: video/webm }
  top_pick:
    heading: { title: POPCORN PLAYER }
    player:
      artist: OG Blacman
      title: Telephone
      track_src: "/music/telephone.mp3"
      duration: 143.9447
    mobile_media: &standard_mobile_media
      poster: "/assets/reference/mobile-standard-background-poster.jpg?v=montage-v1"
      sources:
        - { src: "/assets/reference/mobile-standard-background.mp4?v=montage-v1", type: video/mp4 }
        - { src: "/assets/reference/mobile-standard-background.webm?v=montage-v1", type: video/webm }
  upcoming_shows:
    heading: { title: SHOWS }
    copy: Catch OG Blacman live. New dates and ticket links will be added as shows are announced.
    items:
      - { id: show-01, meta: SHOW DATE, label: SHOW LOCATION // VENUE, action_label: TICKETS COMING SOON, url: null, link_title: null }
      - { id: show-02, meta: SHOW DATE, label: SHOW LOCATION // VENUE, action_label: TICKETS COMING SOON, url: null, link_title: null }
      - { id: show-03, meta: SHOW DATE, label: SHOW LOCATION // VENUE, action_label: TICKETS COMING SOON, url: null, link_title: null }
    mobile_media: *standard_mobile_media
  booking:
    heading: { title: BOOKING }
    manager:
      role: MANAGEMENT
      name: BOOKING & BUSINESS INQUIRIES
      email: CONTACT @OGBLACMAN ON INSTAGRAM
      phone: DETAILS AVAILABLE UPON REQUEST
    mobile_media: *standard_mobile_media
  merch:
    heading: { title: MERCH }
    copy: Rep OG Blacman with official apparel and limited drops. Tap a product to shop the collection on Fourthwall.
    cta: { label: SECTION 6 CTA, url: /respectivestudios, title: Explore Respective Studios }
    items: []
    mobile_media:
      poster: "/assets/reference/mobile-studios-background-poster.jpg?v=montage-v1"
      sources:
        - { src: "/assets/reference/mobile-studios-background.mp4?v=montage-v1", type: video/mp4 }
        - { src: "/assets/reference/mobile-studios-background.webm?v=montage-v1", type: video/webm }
  newsletter:
    heading: { title: GET UPDATES }
    form:
      required_marker: "*"
      fields:
        - { id: name, name: Name, type: text, label: Name, placeholder: Your name, required: false }
        - { id: email, name: Email, type: email, label: Email, placeholder: youremail@email.com, required: true }
      submit_label: "Sign up     →"
      wait_label: Please wait...
      success_message: You're on the list. Thank you for signing up!
      error_message: Something went wrong. Please try again.
    mobile_media:
      poster: "/assets/reference/mobile-clients-background-poster.jpg?v=montage-v1"
      sources:
        - { src: "/assets/reference/mobile-clients-background.mp4?v=montage-v1", type: video/mp4 }
        - { src: "/assets/reference/mobile-clients-background.webm?v=montage-v1", type: video/webm }

